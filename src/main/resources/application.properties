# Configuracion de la aplicacion.
#
# Regla de este archivo: aca NO hay ningun valor concreto de un entorno. Todo se
# lee de una variable con ${VAR:default}, y el default es el que sirve para
# desarrollo. Los valores propios de una maquina viven en
# application-local.properties, que no se commitea.
#
# El motivo es el secreto de firma de los tokens: un secreto escrito en el
# repositorio deja de ser un secreto el dia que el repositorio se comparte, y
# ademas invita a que produccion use el mismo. Ese en particular no tiene default
# a proposito -ver mas abajo-.

spring.application.name=multimetrico-api

# El perfil local se activa solo. Cualquier despliegue setea SPRING_PROFILES_ACTIVE
# explicitamente; si no hay archivo local, Spring no encuentra el perfil y sigue
# con los defaults de aca, que es lo que pasa dentro de la imagen de Docker.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


# --- base de datos ----------------------------------------------------------
#
# Tres niveles, del mas explicito al mas comodo:
#
#   1. MULTIMETRICO_DB_URL     pisa todo. Es el escape para cualquier host.
#   2. MYSQLHOST y companias   los nombres que inyecta Railway al enlazar el
#                              servicio de MySQL. No hay que traducir nada.
#   3. los defaults de abajo   el compose local: localhost:3307.
#
# El 3307 y no el 3306: si la maquina ya tiene un MySQL instalado, el puerto de
# siempre esta tomado y el contenedor no levanta.
spring.datasource.url=${MULTIMETRICO_DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3307}/${MYSQLDATABASE:multimetrico}?characterEncoding=UTF-8&connectionTimeZone=UTC&connectTimeout=10000}
spring.datasource.username=${MYSQLUSER:${MULTIMETRICO_DB_USER:multimetrico}}
spring.datasource.password=${MYSQLPASSWORD:${MULTIMETRICO_DB_PASSWORD:multimetrico}}

# Flyway es el unico dueno del esquema. Hibernate no genera DDL ni siquiera para
# "ayudar": un update automatico al renombrar un campo se lleva puesta la tabla
# de mediciones, que es la historia que este proyecto existe para no perder.
spring.jpa.hibernate.ddl-auto=none

# Sin sesion abierta en la vista. El mapeo pasa entero adentro del metodo del
# repositorio; si algo quedara sin cargar tiene que fallar ahi y no mas tarde
# adentro de un controller.
spring.jpa.open-in-view=false

# DATETIME no guarda zona. Sin esto, el instante en que arranca una importacion
# se escribe en la hora local del servidor y se lee como si fuera UTC: el
# historial ordenado por fecha se corre varias horas.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- pool de conexiones -----------------------------------------------------
#
# Techo del perfil bajo; en Railway lo fija el perfil de recursos con
# SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE. La MySQL de demos atiende a cinco
# APIs y cada conexion ociosa cuenta contra su max_connections: por eso el
# minimo es 1. connection-timeout corto para fallar en 10 s y no colgar el
# request; max-lifetime menor que el wait_timeout de MySQL, para que Hikari
# recicle la conexion antes de que el servidor la corte.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=300000


# --- servidor ---------------------------------------------------------------
#
# En local, el 8082: el 8080 es el portfolio original y el 8081 el rediseno, y
# este arranca en el siguiente libre para tener los tres levantados a la vez.
#
# En un PaaS el puerto no se elige: la plataforma lo inyecta en PORT y espera que
# la aplicacion escuche ahi. Ignorarlo es el motivo numero uno por el que un
# deploy que compila igual no responde nunca.
server.port=${PORT:8082}

# --- apagado ----------------------------------------------------------------
#
# Cada redeploy manda SIGTERM: se terminan los requests en curso antes de
# cerrar, con un tope. Es el default desde Spring Boot 3.4; queda escrito para
# no depender de la version.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- salud ------------------------------------------------------------------
#
# Lo unico expuesto es health, sin detalles: dice UP o DOWN y nada de la base.
# Con probes, la readiness pasa a OUT_OF_SERVICE durante el apagado gradual.
# Requiere spring-boot-starter-actuator y /actuator/health abierto en la
# configuracion de seguridad.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true


# --- seguridad --------------------------------------------------------------
#
# El secreto NO tiene default, y es a proposito. Un default hace que la
# aplicacion arranque igual con una clave conocida, y entonces el dia que alguien
# se olvida de configurarla en produccion no se entera: los tokens se firman con
# la clave que esta en el repositorio y cualquiera puede fabricarse uno.
#
# Sin JWT_SECRETO la aplicacion no arranca y dice por que. Ver
# PropiedadesDeSeguridad, que ademas exige 32 caracteres: HS256 firma con una
# clave de 256 bits y una mas corta la rechaza la libreria con un error que no
# explica nada.
multimetrico.seguridad.jwt.secreto=${JWT_SECRETO:}

# Ocho horas: un turno. Mas corto obliga a volver a entrar en el medio del dia y
# mas largo deja un token vivo despues de que alguien deja la empresa.
multimetrico.seguridad.jwt.minutos-de-vigencia=${JWT_MINUTOS:480}
multimetrico.seguridad.jwt.emisor=${JWT_EMISOR:multimetrico-api}

# El primer administrador, para poder entrar a una base recien creada. Se crea al
# arrancar SOLO si no hay ningun usuario; ver CreadorDeAdminInicial. Sin
# contrasena configurada no se crea nada y se avisa en el log.
multimetrico.seguridad.admin-inicial.legajo=${ADMIN_LEGAJO:admin}
multimetrico.seguridad.admin-inicial.password=${ADMIN_PASSWORD:}


# --- importacion ------------------------------------------------------------
#
# hilos: cuantas importaciones se procesan a la vez. Leer una planilla entera con
#   POI la carga en memoria, asi que subirlo es la forma mas rapida de quedarse
#   sin heap con archivos grandes.
# cola: cuantas esperan turno. Tiene tope a proposito: sin tope una avalancha de
#   cargas se acumula en silencio hasta reventar; con tope, la que sobra falla de
#   entrada y se ve.
multimetrico.importacion.hilos=${IMPORTACION_HILOS:2}
multimetrico.importacion.cola=${IMPORTACION_COLA:50}
