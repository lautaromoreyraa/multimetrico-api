spring:
  application:
    name: multimetrico-api

  datasource:
    # Tres niveles, del mas explicito al mas comodo:
    #
    #   1. MULTIMETRICO_DB_URL     pisa todo. Es el escape para cualquier host.
    #   2. MYSQLHOST y companias   los nombres que inyecta Railway al enlazar el
    #                              servicio de MySQL. No hay que traducir nada.
    #   3. los valores de abajo    el compose local: localhost:3307.
    #
    # El 3307 y no el 3306: si la maquina ya tiene un MySQL instalado, el puerto
    # de siempre esta tomado y el contenedor no levanta.
    url: ${MULTIMETRICO_DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3307}/${MYSQLDATABASE:multimetrico}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQLUSER:${MULTIMETRICO_DB_USER:multimetrico}}
    password: ${MYSQLPASSWORD:${MULTIMETRICO_DB_PASSWORD:multimetrico}}

  jpa:
    hibernate:
      # Flyway es el unico dueno del esquema. Hibernate no genera DDL ni siquiera
      # para "ayudar": un update automatico al renombrar un campo se lleva puesta
      # la tabla de mediciones, que es la historia que este proyecto existe para
      # no perder.
      ddl-auto: none
    # Sin sesion abierta en la vista. El mapeo de entidad a dominio pasa entero
    # adentro del metodo del repositorio; si algo quedara sin cargar tiene que
    # fallar ahi, y no mas tarde adentro de un controller.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # DATETIME no guarda zona. Sin esto, el instante en que arranca una
          # importacion se escribe en la hora local del servidor y se lee como si
          # fuera UTC: el historial ordenado por fecha se corre varias horas.
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # En local, el 8082: el 8080 es el portfolio original y el 8081 el rediseno, y
  # este arranca en el siguiente libre para tener los tres levantados a la vez.
  #
  # En un PaaS el puerto no se elige: la plataforma lo inyecta en PORT y espera
  # que la aplicacion escuche ahi. Ignorarlo es el motivo numero uno por el que
  # un deploy que compila igual no responde nunca.
  port: ${PORT:8082}

# Lo unico ajustable del procesamiento de importaciones. Los valores de abajo son
# los que aplica PropiedadesDeImportacion por defecto; estan escritos igual para
# que se vea que existen, porque el dia que un archivo tarde de mas, subirlos es
# editar esta seccion y no tocar codigo.
#
# hilos: cuantas importaciones se procesan a la vez. Leer una planilla entera con
#   POI la carga en memoria, asi que subirlo es la forma mas rapida de quedarse
#   sin heap con archivos grandes.
# cola: cuantas esperan turno. Tiene tope a proposito: sin tope una avalancha de
#   cargas se acumula en silencio hasta reventar; con tope, la que sobra falla de
#   entrada y se ve.
multimetrico:
  importacion:
    hilos: 2
    cola: 50
