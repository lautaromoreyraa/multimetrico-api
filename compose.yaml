services:
  mysql:
    image: mysql:9
    container_name: multimetrico-mysql
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: multimetrico
      MYSQL_USER: multimetrico
      MYSQL_PASSWORD: multimetrico
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - multimetrico-datos:/var/lib/mysql

volumes:
  multimetrico-datos:
